<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小日子選物｜商品目錄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <span class="brand">小日子選物</span>
  <div class="search-box">
    <input id="search" type="text" placeholder="搜尋商品名稱...">
  </div>
  <div class="topbar-actions">
    <a class="line-btn" id="lineBtn" href="#" target="_blank" rel="noopener">LINE 客服</a>
    <button class="cart-toggle" id="cartToggle">
      選購清單 <span class="cart-count" id="cartCount">0</span>
    </button>
  </div>
</header>

<div id="listView">
  <div class="filters" id="filters"></div>
  <main class="grid" id="grid"></main>
</div>

<section class="detail-view" id="detailView" hidden>
  <button class="back-btn" id="backBtn">← 返回商品列表</button>

  <div class="detail-layout">
    <div class="gallery">
      <div class="gallery-main">
        <img id="galleryMainImg" src="" alt="">
      </div>
      <div class="gallery-thumbs" id="galleryThumbs"></div>
    </div>

    <div class="detail-info">
      <span class="detail-category" id="detailCategory"></span>
      <h1 class="detail-name" id="detailName"></h1>
      <div class="detail-price" id="detailPrice"></div>
      <button class="add-btn detail-add-btn" id="detailAddBtn">加入清單</button>
    </div>
  </div>

  <div class="detail-sections">
    <section class="detail-block" id="specBlock">
      <h2>規格</h2>
      <table class="spec-table" id="specTable"></table>
    </section>

    <section class="detail-block" id="descBlock">
      <h2>產品介紹</h2>
      <p class="detail-desc" id="detailDesc"></p>
    </section>

    <section class="detail-block" id="videoBlock">
      <h2>產品影片</h2>
      <div class="video-wrap" id="videoWrap"></div>
    </section>
  </div>
</section>

<div class="cart-overlay" id="cartOverlay"></div>
<aside class="cart-drawer" id="cartDrawer">
  <div class="cart-header">
    <h2>選購清單</h2>
    <button class="close-btn" id="closeCart">✕</button>
  </div>
  <div class="cart-scroll">
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-footer">
      <div class="cart-total">
        <span>總金額</span>
        <span id="cartTotal">NT$ 0</span>
      </div>
      <div class="checkout-form">
        <label>姓名 <span class="required-mark">*</span></label>
        <input id="customerName" type="text" placeholder="您的姓名">
        <label>聯絡方式(電話或 Line ID) <span class="required-mark">*</span></label>
        <input id="customerContact" type="text" placeholder="方便店家聯繫您">
        <label>備註(選填)</label>
        <textarea id="customerNote" rows="2" placeholder="有其他需求可寫在這裡"></textarea>
        <p class="form-error" id="formError"></p>
      </div>
      <button class="send-btn" id="sendBtn" disabled>用 Email 送出訂單</button>
      <p class="hint">點擊後會開啟您的 Email 軟體,自動帶入訂購明細,請確認後直接送出即可。若沒有跳出 Email 視窗,畫面會改顯示訂單內容,複製後貼到 Email 或 LINE 傳送即可。</p>
    </div>
  </div>
</aside>

<div class="cart-overlay" id="fallbackOverlay"></div>
<div class="fallback-modal" id="fallbackModal">
  <h2>訂單內容</h2>
  <p class="hint">若沒有自動跳出 Email 視窗,請複製以下內容,貼到 Email、LINE 或訊息軟體中傳送給店家。</p>
  <textarea id="fallbackText" readonly></textarea>
  <div class="fallback-actions">
    <button class="send-btn" id="copyBtn">複製訂單內容</button>
    <button class="cart-toggle" id="closeFallback">關閉</button>
  </div>
</div>
